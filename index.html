<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Ez az oldal egy személyre szabott Valentine‑kérdés Böbének.
    A szövegek magyarul jelennek meg, a címben és a kártya szövegében szerepel a neve.
    A "Nem" gomb menekül a kurzor elől, hogy vicces legyen, az "Igen" gomb pedig konfetti‑animációt indít.
  -->
  <title>Böbe, leszel a Valentinom?</title>
  <style>
    /* Alapvető tipográfia és elrendezés */
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #ffe6f0, #fff);
    }
    .card {
      width: min(520px, 92vw);
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(255, 105, 180, .25);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; opacity: .8; }
    .btns { display: flex; justify-content: center; gap: 14px; margin-top: 12px; }
    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      transition: transform .12s ease;
    }
    button:active { transform: scale(.98); }
    #yes { background: #ff4da6; color: white; }
    #no  { background: #f1f1f1; }
    /* A "Nem" gomb lebegő pozícióhoz stílusok */
    #no.floaty {
      position: absolute;
      left: 50%;
      top: 70%;
      transform: translate(-50%, -50%);
    }
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
    }
    .msg { margin-top: 14px; font-weight: 600; color: #ff2f92; display:none; }
  </style>
</head>
<body>
  <!-- Konfetti animáció vászon -->
  <canvas class="confetti" id="confetti"></canvas>

  <div class="card" id="card">
    <h1>💌 Böbe, leszel a Valentinom?</h1>
    <p>Csak egy gyors kérdés… 😇</p>

    <div class="btns">
      <button id="yes">Igen 💖</button>
      <button id="no">Nem 🙃</button>
    </div>

    <div class="msg" id="msg">Yesss!!! 🥰💘</div>
  </div>

  <script>
    const card = document.getElementById('card');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const msg = document.getElementById('msg');

    // "Nem" gomb menekül, amikor fölé viszed az egeret (vagy megérinted mobilon)
    function moveNoButton() {
      noBtn.classList.add('floaty');
      const rect = card.getBoundingClientRect();
      const padding = 20;

      const maxX = rect.width - noBtn.offsetWidth - padding;
      const maxY = rect.height - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX + padding/2;
      const y = Math.random() * maxY + padding/2;

      noBtn.style.left = `${x}px`;
      noBtn.style.top  = `${y}px`;
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    // Mobilos érintéskor is kerüli el
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); }, {passive:false});

    // Igen gomb: üzenet + konfetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();

    function confettiBurst(durationMs = 1200) {
      canvas.style.display = 'block';
      const pieces = Array.from({length: 160}, () => ({
        x: Math.random() * canvas.width,
        y: -20,
        vx: (Math.random()-0.5) * 8,
        vy: Math.random() * 6 + 4,
        r: Math.random() * 6 + 3,
        a: Math.random() * Math.PI * 2
      }));
      const start = performance.now();

      function frame(t) {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for (const p of pieces) {
          p.x += p.vx; p.y += p.vy; p.a += 0.1;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a);
          ctx.fillStyle = `hsl(${Math.random()*360}, 90%, 60%)`;
          ctx.fillRect(-p.r, -p.r, p.r*2, p.r*2);
          ctx.restore();
        }
        if (t - start < durationMs) requestAnimationFrame(frame);
        else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display = 'none'; }
      }
      requestAnimationFrame(frame);
    }

    yesBtn.addEventListener('click', () => {
      msg.style.display = 'block';
      confettiBurst();
      noBtn.style.display = 'none';
      yesBtn.textContent = '💘';
    });
  </script>
</body>
</html>
